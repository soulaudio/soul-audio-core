# Automated dependency updates + security PRs. The commit-message prefixes keep
# Dependabot's PR titles Conventional-Commit-compliant so they pass pr-title.yml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
