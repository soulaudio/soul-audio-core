name: Actions lockfile

# Supply-chain guard: every action ref in the workflows is pinned to an exact commit
# in `.github/workflows/actions.lock` (readable version tags stay in the workflows; the
# lockfile records the verified commit + owner/repo id of each action, transitive ones
# included). This job re-resolves and fails if anything drifts: a moved/force-pushed tag,
# an un-onboarded action, or a hand-edited lockfile. Regenerate with `gh actions-lock`.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gh actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1
      - name: Verify the lockfile is current
        run: gh actions-lock --verify
