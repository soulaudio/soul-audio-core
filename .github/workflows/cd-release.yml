name: CD

# Cut a GitHub release when a version tag is pushed. The full gate must pass
# first. (Publishing the crates to crates.io can be added here later, once the
# library is ready for a registry release.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: verify + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        run: |
          rustup component add rustfmt clippy
          rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify before releasing
        run: cargo xtask ci

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: cyclonedx-json
          output-file: soul-audio-core.cdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@e598afbe1493e6b1bafb1f389cabb956eab91231 # v3
        with:
          generate_release_notes: true
          files: soul-audio-core.cdx.json
