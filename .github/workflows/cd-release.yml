name: CD

# Cut a GitHub release when a version tag is pushed. The full gate must pass
# first. (Publishing the crates to crates.io can be added here later, once the
# library is ready for a registry release.)
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: verify + release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        run: |
          rustup component add rustfmt clippy
          rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Verify before releasing
        run: cargo xtask ci

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          format: cyclonedx-json
          output-file: soul-audio-core.cdx.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: soul-audio-core.cdx.json
