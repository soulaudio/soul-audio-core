name: CI
on:
  push:
  pull_request:

jobs:
  host:
    name: host (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  embedded:
    name: embedded (thumbv7em build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabihf
      - uses: Swatinem/rust-cache@v2
      - name: core builds no_std for STM32
        run: cargo build -p soul-audio-core --target thumbv7em-none-eabihf --no-default-features
      - name: firmware builds for STM32
        run: cargo build -p soul-audio-firmware --target thumbv7em-none-eabihf

  app:
    name: app (soul-player fmt, clippy, tests)
    runs-on: ubuntu-latest
    env:
      SOUL_PLAYER_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri + audio system deps
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev libasound2-dev
      - name: fmt (app)
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check
      - name: clippy (app)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (app)
        working-directory: app/src-tauri
        run: cargo test

  frontend:
    name: frontend (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: install
        working-directory: app
        run: npm ci
      - name: playwright chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: vitest
        working-directory: app
        run: npm test
