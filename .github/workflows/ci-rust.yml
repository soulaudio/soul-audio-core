name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (fmt · clippy · tests · no_std cross-builds)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the channel, components, and the thumbv7em
      # target; rustup installs them on first use. Add them explicitly so a
      # missing component fails fast and clearly.
      - name: Set up Rust
        run: |
          rustup component add rustfmt clippy
          rustup target add thumbv7em-none-eabihf

      - uses: Swatinem/rust-cache@v2

      # The full gate: fmt, clippy -D warnings, generated-table checks, the host
      # test suite, and the no_std cross-builds for the STM32 target.
      - name: cargo xtask ci
        run: cargo xtask ci
