name: CI (macOS audio)

# The CoreAudio exclusive / bit-perfect sink (`soul-audio-desktop`, feature
# `coreaudio-exclusive`) only compiles on macOS, so the Linux gate never sees it.
# This job builds + lints it, runs its device-free unit tests, then runs the
# real-device suite against a BlackHole virtual output (hosted runners have no audio
# hardware): hog mode, per-track native-rate switching across BlackHole's full rate
# ladder, restore-on-drop, cross-process "device in use", release-on-process-death,
# and a bit-exact loopback capture.

on:
  push:
    branches: [main, dev]
    paths:
      - "crates/soul-audio-desktop/**"
      - "crates/soul-audio-core/src/sink.rs"
      - "crates/soul-audio-core/src/convert.rs"
      - ".github/workflows/ci-macos-audio.yml"
      - "Cargo.lock"
  pull_request:
    paths:
      - "crates/soul-audio-desktop/**"
      - "crates/soul-audio-core/src/sink.rs"
      - "crates/soul-audio-core/src/convert.rs"
      - ".github/workflows/ci-macos-audio.yml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-macos-audio-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  coreaudio:
    name: coreaudio exclusive (${{ matrix.os }})
    # Every Apple desktop architecture GitHub hosts: Apple silicon on the current and
    # next macOS, plus Intel. The fake-HAL contract suite (every recorded device profile
    # × every fault) needs no device; the BlackHole steps exercise the real AUHAL path.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Rust
        run: rustup component add clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Clippy (coreaudio-exclusive)
        run: cargo clippy -p soul-audio-desktop --features coreaudio-exclusive --all-targets -- -D warnings

      - name: Unit + fake-HAL contract suite (device-free)
        run: cargo test -p soul-audio-desktop --features coreaudio-exclusive

      # BlackHole is a GPL-3.0 virtual audio driver installed only on the CI runner as
      # a test fixture — never linked into or shipped with the crate. coreaudiod must
      # be restarted to load the new HAL plug-in.
      # Same recipe as mozilla/cubeb-coreaudio-rs CI. Hosted runners only have a flaky
      # "Null Audio Device" (missing on some runs), so always install a real one and
      # make it the default output.
      - name: Install BlackHole virtual audio device
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall -9 coreaudiod || true
          for i in $(seq 1 30); do
            if system_profiler SPAudioDataType | grep -q "BlackHole 2ch"; then break; fi
            sleep 1
          done
          system_profiler SPAudioDataType | grep -q "BlackHole 2ch" || { echo "::error::BlackHole did not load"; exit 1; }
          SwitchAudioSource -s "BlackHole 2ch" -t output

      - name: Capture BlackHole device profile (artifact)
        run: >
          cargo run -p soul-audio-desktop --features coreaudio-exclusive
          --example coreaudio_device_report -- --probe-hog --out device-profiles

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-profiles-${{ matrix.os }}
          path: device-profiles/

      - name: Hardware suite on BlackHole (hog / native rate / restore / in-use / crash)
        env:
          SOUL_CA_DEVICE: BlackHole 2ch
        run: >
          cargo test -p soul-audio-desktop --features coreaudio-exclusive
          --test coreaudio_exclusive_suite --
          --ignored --nocapture --test-threads=1
          --skip bit_perfect_loopback_through_blackhole

      # Captures BlackHole's input side (hosted runners grant the microphone TCC
      # permission). Green on macos-15, macos-26 and macos-15-intel, so it gates.
      - name: Bit-perfect loopback through BlackHole
        env:
          SOUL_CA_DEVICE: BlackHole 2ch
        run: >
          cargo test -p soul-audio-desktop --features coreaudio-exclusive
          --test coreaudio_exclusive_suite --
          --ignored --nocapture --exact bit_perfect_loopback_through_blackhole

  # Spike (non-blocking until proven): a *custom-built* BlackHole that only offers 44.1k and
  # 96k, so the real AUHAL path — not just the fake HAL — exercises the closest-same-family
  # fallback (22.05/176.4/352.8k → 44.1k; 32/192/384k → 96k) on a device with a restricted
  # rate ladder, like many real DACs and HDMI sinks. Single-Mac project: this is how device
  # classes we don't own get real-device coverage. Built from BlackHole v0.7.1 (GPL-3.0; a CI
  # test fixture only, never linked or shipped), ad-hoc signed — whether hosted runners load
  # an ad-hoc-signed HAL plug-in is exactly what this job finds out.
  restricted-ladder:
    name: restricted-rate BlackHole (${{ matrix.os }})
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build BlackHole with a 44.1k / 96k ladder
        run: |
          git clone --quiet https://github.com/ExistentialAudio/BlackHole.git "$RUNNER_TEMP/BlackHole"
          git -C "$RUNNER_TEMP/BlackHole" checkout --quiet e2b22aaaba4e507a097131704bf96dabc004d9cf # v0.7.1
          cd "$RUNNER_TEMP/BlackHole"
          defs='$GCC_PREPROCESSOR_DEFINITIONS kDriver_Name=\"BlackHoleLadder\" kPlugIn_BundleID=\"audio.soulaudio.ladder\" kSampleRates=44100,96000'
          xcodebuild -project BlackHole.xcodeproj -configuration Release -derivedDataPath build \
            PRODUCT_BUNDLE_IDENTIFIER=audio.soulaudio.ladder \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            GCC_PREPROCESSOR_DEFINITIONS="$defs" | tail -5
          drv="$(find build -name '*.driver' -maxdepth 6 | head -1)"
          echo "built: $drv"
          codesign -dv "$drv" 2>&1 | head -5 || true
          sudo cp -R "$drv" /Library/Audio/Plug-Ins/HAL/BlackHoleLadder.driver

      - name: Load it (restart coreaudiod) and find the device
        run: |
          sudo killall -9 coreaudiod || true
          for i in $(seq 1 30); do
            system_profiler SPAudioDataType | grep -q "BlackHoleLadder" && break
            sleep 1
          done
          system_profiler SPAudioDataType | grep -E "^\s{8}[A-Za-z].*:$" || true
          name="$(system_profiler SPAudioDataType | sed -n 's/^ *\(BlackHoleLadder[^:]*\):$/\1/p' | head -1)"
          [ -n "$name" ] || { echo "::error::the ad-hoc-signed BlackHoleLadder driver did not load"; exit 1; }
          echo "SOUL_CA_DEVICE=$name" >> "$GITHUB_ENV"
          echo "device: $name"

      - name: Capture its device profile (artifact) and check the ladder
        run: |
          cargo run -p soul-audio-desktop --features coreaudio-exclusive \
            --example coreaudio_device_report -- --probe-hog --out device-profiles
          python3 - <<'PY'
          import glob, json, os
          name = os.environ["SOUL_CA_DEVICE"]
          for f in glob.glob("device-profiles/*.json"):
              d = json.load(open(f))
              if d["name"] == name:
                  rates = sorted({fm["rate_min"] for fm in d["formats"]})
                  print(name, "rates", rates, "hog", d["hog"])
                  assert rates == [44100, 96000], rates
                  break
          else:
              raise SystemExit(f"no profile for {name}")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-profiles-ladder-${{ matrix.os }}
          path: device-profiles/

      - name: Hardware suite on the restricted ladder (incl. closest-same-family fallback)
        run: >
          cargo test -p soul-audio-desktop --features coreaudio-exclusive
          --test coreaudio_exclusive_suite --
          --ignored --nocapture --test-threads=1
