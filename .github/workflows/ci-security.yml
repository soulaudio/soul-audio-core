name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so newly-disclosed advisories are caught even without a push.
    - cron: '27 6 * * 1'
  # Lets the long fuzz run (below) be kicked off on demand, e.g. after touching
  # a parser, without waiting for the weekly tick.
  workflow_dispatch:
    inputs:
      fuzz_seconds:
        description: 'Per-surface fuzz budget in seconds'
        required: false
        default: '420'

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    # Force the shim to the preinstalled stable: cargo-audit is a prebuilt binary
    # (no compile), but the repo pins an older toolchain that can't build some
    # tools — this keeps the audit independent of the project's pinned rustc.
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      # Prebuilt binary — avoids compiling cargo-audit (whose latest deps need a
      # newer rustc than this repo's pinned toolchain).
      - uses: taiki-e/install-action@v2.90.8
        with:
          tool: cargo-audit
      - name: Vulnerability scan
        run: cargo audit

  deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          command: check bans licenses sources

  # Long-mode fuzzing of every untrusted-byte surface. NOT on pull_request: the
  # per-PR gate already runs each fuzzer's bounded CI mode (a fixed seed, a few
  # thousand inputs), which is a regression check, not a search. Finding *new*
  # bugs needs volume and a fresh corpus, and that belongs on a schedule rather
  # than in everyone's PR latency.
  #
  # The seed is the run number, so each run explores different inputs and any
  # failure is exactly reproducible from the log (`FUZZ_SEED=<n>` locally).
  # Debug build on purpose: these harnesses hunt arithmetic-overflow panics,
  # which release builds silently wrap instead of catching.
  fuzz:
    name: long fuzz (decode, tags, index, art, eq, cue)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEED: ${{ github.run_number }}
      BUDGET: ${{ github.event.inputs.fuzz_seconds || '420' }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Decode surface (containers + codecs + DSD + Vorbis)
        run: cargo test -p soul-audio-core --test fuzz -- --nocapture
        env:
          FUZZ_SEED: ${{ env.SEED }}
          FUZZ_SECONDS: ${{ env.BUDGET }}
      - name: Tag surface (every container's metadata reader)
        run: cargo test -p soul-audio-tags --test fuzz -- --nocapture
        env:
          TAG_FUZZ_SEED: ${{ env.SEED }}
          TAG_FUZZ_SECONDS: ${{ env.BUDGET }}
      - name: Index reader (.soulidx off an SD card)
        run: cargo test -p soul-audio-index --features build --test fuzz -- --nocapture
        env:
          IDX_FUZZ_SEED: ${{ env.SEED }}
          # Iteration-bounded (no time knob): ~30k inputs/s in a debug build, so
          # this is a couple of minutes.
          IDX_FUZZ_ITERS: '4000000'
      - name: Art blob reader (covers off the same card)
        run: cargo test -p soul-audio-artbake --test fuzz -- --nocapture
        env:
          ART_FUZZ_SEED: ${{ env.SEED }}
          ART_FUZZ_ITERS: '4000000'
      - name: EQ profiles (AutoEq text → biquads → audio)
        run: cargo test -p soul-audio-eq --test profile_fuzz -- --nocapture
        env:
          EQ_FUZZ_SEED: ${{ env.SEED }}
          # ~5k profiles/s in a debug build (each designs every band at five
          # device rates and runs a block of audio), so this is ~2 minutes.
          EQ_FUZZ_ITERS: '600000'
      - name: Cue sheets (parse + ranges + sub-range seek)
        run: cargo test -p soul-audio-playlist --test cue_fuzz -- --nocapture
        env:
          CUE_FUZZ_SEED: ${{ env.SEED }}
          CUE_FUZZ_ITERS: '4000000'

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Generate SBOM from Cargo.lock
        uses: anchore/sbom-action@v0.24.3
        with:
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: sbom.cdx.json
