name: Scorecard

# OpenSSF Scorecard — scores the repo's supply-chain / security posture (branch
# protection, pinned dependencies, token permissions, dangerous workflows, …).
# Results are uploaded to the code-scanning dashboard and published to the public
# OpenSSF API so the README Scorecard badge resolves. Scorecard rates the repo as
# a whole (not a diff), so it runs on main + on a schedule + when branch
# protection changes — not on every PR.
on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    # Weekly re-score.
    - cron: '18 6 * * 1'

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the SARIF to code scanning
      id-token: write        # publish_results -> OpenSSF API (badge)
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish so the badge + public Scorecard record stay current (main only).
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@52cf1852265d99e9bea071b03366fc777a602909 # v3 (codeql-bundle-v2.27.4)
        with:
          sarif_file: results.sarif
