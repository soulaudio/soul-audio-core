# lefthook.yml — git hooks for soul-audio-core.
#
# Requires the lefthook binary. Install one of:
#   go install github.com/evilmartians/lefthook@latest
#   npm i -D lefthook   |   scoop install lefthook   |   choco install lefthook
#
# Enable the hooks once per clone:  lefthook install
# (If you use a global `core.hooksPath` dispatcher that delegates to lefthook,
#  don't run `lefthook install` — it would target the global dir. See README.)

# Fast checks — keep commits quick. `xtask precommit` runs tree-wide `fmt` and
# scopes `clippy` to the crates with staged changes (a shared no_std / workspace
# change falls back to full clippy). Runs whenever Rust/Cargo files are staged.
pre-commit:
  commands:
    checks:
      glob: "*.{rs,toml}"
      run: cargo xtask precommit

# Commit-message policy: Conventional Commits + a clean history (no AI /
# attribution trailers). Pure-Rust check so it behaves identically on every
# platform — `{1}` is the path to the commit-message file git passes in.
commit-msg:
  commands:
    policy:
      run: cargo xtask check-commit-msg {1}

# Change-scoped gate before pushing: tree-wide `fmt` + `clippy`/tests for the
# changed host crates. A shared no_std crate or a workspace-level change falls
# back to the full gate (host tests + the thumbv7em cross-builds). The full gate
# is also run in CI on the dev->main PR, which is the authoritative backstop.
pre-push:
  commands:
    gate:
      run: cargo xtask verify
