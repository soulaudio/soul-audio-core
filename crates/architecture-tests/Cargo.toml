[package]
name = "architecture-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# No `[lints] workspace = true`: the no_alloc test needs an unsafe GlobalAlloc
# impl and must not be denied by workspace lints.

[dev-dependencies]
soul-audio-core = { path = "../soul-audio-core" }
soul-audio-catalog = { path = "../soul-audio-catalog" }
# Default features = the no-alloc reader (no `build` baker).
soul-audio-index = { path = "../soul-audio-index" }
embedded-io = { workspace = true }
cargo_metadata = "0.18"
