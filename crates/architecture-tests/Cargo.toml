[package]
name = "architecture-tests"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
publish = false

# No `[lints] workspace = true`: the no_alloc test needs an unsafe GlobalAlloc
# impl and must not be denied by workspace lints.

[dev-dependencies]
soul-audio-core = { path = "../soul-audio-core" }
soul-audio-catalog = { path = "../soul-audio-catalog" }
# The no-alloc gate measures the READER, but it needs a real baked index to
# read — an empty/foreign-version header makes every accessor return before it
# touches the source, which is how that test used to measure nothing. The
# `build` baker is host-side std and runs OUTSIDE the measured region.
soul-audio-index = { path = "../soul-audio-index", features = ["build"] }
# doc_claims.rs reads `FORMAT_VERSION` to check what ARCHITECTURE.md announces.
# signal_integrity.rs: the audiophile fitness functions need the DSP chain model
# (shared with soul-player-ng and the DAP) and the equalizer it applies through.
soul-audio-dsp = { path = "../soul-audio-dsp", features = ["serde"] }
serde_json = "1"
soul-audio-eq = { path = "../soul-audio-eq" }
embedded-io = { workspace = true }
cargo_metadata = "0.18"
