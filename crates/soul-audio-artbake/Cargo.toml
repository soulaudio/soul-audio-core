[package]
name = "soul-audio-artbake"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The .soulidx art.blob: a no_std/no-alloc 1-bit cover-art reader (DAP ArtStore) and, behind `build`, a std writer + image→1-bit encoder (desktop). Mirrors soul-audio-index's read/write split."

[lints]
workspace = true

[features]
default = []
alloc = []
std = ["alloc"]
build = ["std", "dep:image"]

[dependencies]
soul-audio-core = { path = "../soul-audio-core" }
soul-audio-catalog = { path = "../soul-audio-catalog" }
embedded-io = { workspace = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"], optional = true }

[dev-dependencies]
embedded-io-adapters = { workspace = true, features = ["std"] }

[[test]]
name = "roundtrip"
required-features = ["build"]
