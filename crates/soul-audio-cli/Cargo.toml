[package]
name = "soul-audio-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Desktop test harness for soul-audio-core."

[lints]
workspace = true

[dependencies]
soul-audio-core = { path = "../soul-audio-core" }
soul-audio-engine = { path = "../soul-audio-engine" }
soul-audio-desktop = { path = "../soul-audio-desktop" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[features]
default = []
playback = ["soul-audio-desktop/playback"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
# Parametric-EQ band design for the full-pipeline signal E2E (pipeline_e2e.rs) —
# the host's DspSink applies EQ through soul-audio-core's Equalizer, designed here.
soul-audio-eq = { path = "../soul-audio-eq" }
# FFT for signal-analysis E2E (tone pitch / SNR / channel routing on rendered
# audio). Host tests only — never shipped.
rustfft = "6"
