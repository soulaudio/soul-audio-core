[package]
name = "soul-audio-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cross-platform no_std, no-alloc audio decode + resample + playback core (WAV/FLAC/MP3/DSD)."

[lints]
workspace = true

[dependencies]
embedded-io = { workspace = true }

# Host-only: FFT for the resampler's objective DSP-quality tests (alias/SNR
# measurement). Never compiled into the no_std library or the firmware.
[dev-dependencies]
rustfft = "6"
