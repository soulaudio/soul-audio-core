[package]
name = "soul-audio-firmware"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "STM32H743 Embassy firmware shell for soul-audio-core."

# Intentionally NO `[lints] workspace = true`: Embassy macros/HAL can trip
# host-oriented clippy lints. The firmware is gated by *building* for the
# target, not by clippy.

[[bin]]
name = "soul-audio-firmware"
test = false
bench = false
doctest = false

[dependencies]
soul-audio-core = { path = "../soul-audio-core" }
# The no-alloc `.soulidx` reader + catalog ports (default features = reader, NOT
# the std `build` baker) — the DAP reads the card-baked index, never bakes.
soul-audio-catalog = { path = "../soul-audio-catalog" }
soul-audio-index = { path = "../soul-audio-index" }
embedded-io = { workspace = true }
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
defmt = "1"
defmt-rtt = "1"
panic-probe = { version = "1", features = ["print-defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h743zi", "memory-x", "time-driver-any", "defmt"] }
embedded-sdmmc = { version = "0.9.0", default-features = false }
static_cell = "2"
# Embassy deps are added via `cargo add` (versions move fast) — see the plan.
