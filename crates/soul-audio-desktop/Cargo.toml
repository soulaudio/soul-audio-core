[package]
name = "soul-audio-desktop"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Shared std desktop-playback building blocks for soul-audio (cpal sink, owned file decoder, file sources)."

[lints]
workspace = true

[dependencies]
soul-audio-core = { path = "../soul-audio-core" }
embedded-io = { workspace = true }
embedded-io-adapters = { workspace = true, features = ["std"] }
anyhow = "1"

[features]
default = []
playback = ["dep:cpal", "dep:ringbuf"]
# WASAPI exclusive / bit-perfect output (Windows only). Reuses the shared ring + the
# real-time fill from `playback`; adds the `wasapi` backend for exclusive-mode streams.
wasapi-exclusive = ["playback", "dep:wasapi"]
# CoreAudio exclusive / bit-perfect output (macOS only): hog mode + per-track nominal
# sample-rate switching + widest integer physical format. Reuses the shared ring + the
# real-time fill from `playback`; adds a direct `coreaudio-rs` dep (the same 0.11 cpal
# already links on macOS, so no second copy) for its safe AUHAL + device helpers.
coreaudio-exclusive = ["playback", "dep:coreaudio-rs"]
# Exposes `fake_hal` (the scriptable fake CoreAudio-style device world) to downstream
# test suites. Never enabled in shipped builds. Needs only the ring (no cpal), so the
# contract suite also runs on Linux CI without ALSA.
test-util = ["dep:ringbuf"]

[dev-dependencies]
# Device-profile fixtures (tests/fixtures/coreaudio/*.json) for the fake-HAL contract suite.
serde_json = "1"
# Self dev-dependency: turns on `test-util` (the fake HAL) for this crate's own integration
# tests, so the contract suite runs in a plain `cargo test` on every OS.
soul-audio-desktop = { path = ".", features = ["test-util"] }

[dependencies.cpal]
version = "0.15"
optional = true

[dependencies.ringbuf]
# 0.6 (API-compatible traits surface with 0.4) — 0.4.x carries RUSTSEC-2026-0293,
# a use-after-free in `Consumer::clear`/`skip` (which `sink.rs` calls). Fixed >=0.5.2.
version = "0.6"
optional = true

# WASAPI exclusive-mode backend (Windows only, MIT-licensed). Opens the DAC with
# AUDCLNT_SHAREMODE_EXCLUSIVE for bit-perfect output, bypassing the OS mixer.
[target.'cfg(windows)'.dependencies.wasapi]
version = "0.27"
optional = true

# CoreAudio AUHAL + HAL device helpers (macOS only, MIT/Apache-2.0). Pinned to the same
# 0.11 line cpal 0.15 uses, with the same minimal feature set, so the graph keeps one
# copy. Its `macos_helpers` expose hog mode / nominal-rate / physical-format control as
# SAFE functions, so this crate stays `forbid(unsafe_code)`.
[target.'cfg(target_os = "macos")'.dependencies.coreaudio-rs]
version = "0.11"
optional = true
default-features = false
features = ["audio_unit", "core_audio"]
