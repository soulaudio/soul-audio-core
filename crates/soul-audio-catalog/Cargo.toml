[package]
name = "soul-audio-catalog"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "no_std music-catalog model + ports (Catalog/ArtStore) shared 1:1 by the desktop app and the DAP. See docs/superpowers/specs/2026-11-08-shared-catalog-index-architecture.md."

[lints]
workspace = true

[features]
default = []
alloc = []
std = ["alloc"]
# Opt-in serde impls on PackedDate (the `-ng` head enables this transitively via
# soul-audio-import's `serde` feature, to persist the warm scan cache). Off by
# default so the no_std / no-alloc surface is unaffected — a bare `u32` newtype
# needs no alloc even with serde on.
serde = ["dep:serde"]

[dependencies]
soul-audio-core = { path = "../soul-audio-core" }
embedded-io = { workspace = true }

[dependencies.serde]
version = "1"
optional = true
default-features = false
features = ["derive"]

[dev-dependencies]
# Test-only: exercise PackedDate's serde impl through a concrete JSON
# serializer (the desktop's choice). Not part of the crate's own dep surface.
serde_json = "1"
