[workspace]
resolver = "3"
members = [
  "crates/soul-audio-core",
  "crates/soul-audio-engine",
  "crates/soul-audio-queue",
  "crates/soul-audio-control",
  "crates/soul-audio-loudness",
  "crates/soul-audio-desktop",
  "crates/soul-audio-service",
  "crates/soul-audio-cli",
  "crates/soul-audio-firmware",
  "crates/soul-audio-tags",
  "crates/soul-audio-catalog",
  "crates/soul-audio-index",
  "crates/soul-audio-artbake",
  "crates/soul-audio-import",
  "crates/soul-audio-organize",
  "crates/soul-audio-multicatalog",
  "crates/architecture-tests",
  "xtask",
]
default-members = [
  "crates/soul-audio-core",
  "crates/soul-audio-engine",
  "crates/soul-audio-queue",
  "crates/soul-audio-control",
  "crates/soul-audio-loudness",
  "crates/soul-audio-desktop",
  "crates/soul-audio-service",
  "crates/soul-audio-cli",
  "crates/soul-audio-tags",
  "crates/soul-audio-catalog",
  "crates/soul-audio-index",
  "crates/soul-audio-artbake",
  "crates/soul-audio-import",
  "crates/soul-audio-organize",
  "crates/soul-audio-multicatalog",
  "crates/architecture-tests",
  "xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "local"

[workspace.dependencies]
embedded-io = "0.6"
embedded-io-adapters = "0.6"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
debug = 2          # keep debuginfo for defmt/probe-rs; stripped from flash image

# The decode hot path (DSD cascaded-FIR decimation, the resampler) is far too slow
# unoptimized to sustain the audio clock in real time — DSD starves the sink and
# plays at the wrong speed in a debug build. Optimize just this crate at -O3 in
# dev/test so a debug build still decodes faster than real time, while the rest of
# the workspace stays debuggable. Guarded by `dsd_decodes_faster_than_real_time`.
# Consumers (e.g. the -ng app) need the same override in their own workspace.
[profile.dev.package.soul-audio-core]
opt-level = 3
[profile.test.package.soul-audio-core]
opt-level = 3
